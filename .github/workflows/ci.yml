name: CI

# pull_request is unfiltered: stacked PRs (based on other feature branches)
# must run CI too.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    # ATTIC_TOKEN_PUBLIC only exists in the public-cache environment; master
    # jobs must opt into it to publish to the public cache.
    environment: ${{ github.ref == 'refs/heads/master' && 'public-cache' || '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}

      # Checks run only when named below; fail if one has no step.
      - name: Every check has a step
        run: |
          checks=$(nix eval --raw '.#checks.x86_64-linux' --apply 'cs: toString (builtins.attrNames cs)')
          for c in $checks; do
            grep -qF "'.#checks.x86_64-linux.$c'" .github/workflows/ci.yml \
              || { echo "::error::no step builds checks.x86_64-linux.$c"; exit 1; }
          done

      - name: Example module tests
        run: nix build '.#checks.x86_64-linux.example-tests' -L

      - name: External library from LOGOS_EXT_ROOT_<NAME>
        run: nix build '.#checks.x86_64-linux.external-libs-root' -L

      - name: External library from the staged ../lib
        run: nix build '.#checks.x86_64-linux.external-libs-staged' -L
